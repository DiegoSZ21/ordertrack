services:
  # ─── 1. Servicio de Pedidos (API REST) ──────────────────────────
  - type: web
    name: ordertrack-orders-service
    env: node
    plan: free
    rootDir: services/orders-service
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run prisma:deploy && npm run seed && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: ordertrack-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

  # ─── 2. Servicio de Tiempo Real (Socket.IO) ─────────────────────
  - type: web
    name: ordertrack-realtime-service
    env: node
    plan: free
    rootDir: services/realtime-service
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3002
      - key: JWT_SECRET
        fromService:
          type: web
          name: ordertrack-orders-service
          envVarKey: JWT_SECRET

  # ─── 3. Frontend Angular (PWA / SPA) ────────────────────────────
  - type: web
    name: ordertrack-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install --legacy-peer-deps && npm run build:prod
    staticPublishPath: ./dist/ordertrack-frontend/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# ─── 4. Base de Datos PostgreSQL Administrada ─────────────────────
databases:
  - name: ordertrack-db
    plan: free
    databaseName: ordertrack
    user: ordertrack_user
