services:
  # ─── 1. Servicio de Pedidos (API REST) ──────────────────────────
  - type: web
    name: ordertrack-orders-service
    env: node
    plan: free
    rootDir: services/orders-service
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ordertrack-db
          property: connectionString
      - key: JWT_SECRET
        value: ordertrack_upn_production_jwt_super_secret_key_2026
      - key: JWT_REFRESH_SECRET
        value: ordertrack_upn_production_jwt_refresh_secret_key_2026

  # ─── 2. Servicio de Tiempo Real (Socket.IO) ─────────────────────
  - type: web
    name: ordertrack-realtime-service
    env: node
    plan: free
    rootDir: services/realtime-service
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        value: ordertrack_upn_production_jwt_super_secret_key_2026

  # ─── 3. Frontend Angular (PWA / SPA) ────────────────────────────
  - type: web
    name: ordertrack-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install --legacy-peer-deps && npm run build:prod
    staticPublishPath: ./dist/ordertrack-frontend/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# ─── 4. Base de Datos PostgreSQL Administrada ─────────────────────
databases:
  - name: ordertrack-db
    plan: free
    databaseName: ordertrack
    user: ordertrack_user
